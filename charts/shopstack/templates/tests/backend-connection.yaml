apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "shopstack.fullname" . }}-backend-test"
  labels:
    {{- include "shopstack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test
      image: busybox:1.36
      command:
        - wget
      args:
        - "--spider"
        - "http://{{ include "shopstack.fullname" . }}-backend:{{ .Values.backend.service.port }}/docs"
  restartPolicy: Never