{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shopstack.backendName" . }}
  labels:
    {{- include "shopstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend

spec:
  replicas: {{ .Values.backend.replicaCount }}

  revisionHistoryLimit: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "shopstack.name" . }}
      app.kubernetes.io/component: backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "shopstack.name" . }}
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:
      serviceAccountName: {{ include "shopstack.serviceAccountName" . }}

      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: {{ .Values.backend.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.backend.securityContext.runAsUser }}
        runAsGroup: {{ .Values.backend.securityContext.runAsGroup }}
        fsGroup: {{ .Values.backend.securityContext.fsGroup }}

      terminationGracePeriodSeconds: 30

      containers:
        - name: backend

          image: >-
            {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}
            {{- if .Values.backend.image.digest }}
            @{{ .Values.backend.image.digest }}
            {{- end }}

          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "shopstack.fullname" . }}-config

          securityContext:
            allowPrivilegeEscalation: {{ .Values.backend.containerSecurityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.backend.containerSecurityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                {{- range .Values.backend.containerSecurityContext.capabilities.drop }}
                - {{ . }}
                {{- end }}

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          startupProbe:
            httpGet:
              path: {{ .Values.backend.probes.startup.path }}
              port: {{ .Values.backend.probes.startup.port }}
            failureThreshold: {{ .Values.backend.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.backend.probes.startup.periodSeconds }}

          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: {{ .Values.backend.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold }}

          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: {{ .Values.backend.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold }}

{{- end }}