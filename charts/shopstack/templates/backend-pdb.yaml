{{- if and .Values.backend.enabled .Values.backend.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "shopstack.backendName" . }}
  labels:
    {{- include "shopstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend

spec:
  minAvailable: {{ .Values.backend.podDisruptionBudget.minAvailable }}

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "shopstack.name" . }}
      app.kubernetes.io/component: backend
{{- end }}