apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: shopstack-dev
  namespace: argocd

spec:
  project: shopstack-dev

  sources:

    # Helm chart
    - repoURL: https://github.com/yureshgurung/shopstack-gitops.git
      targetRevision: main
      path: charts/shopstack

      helm:
        valueFiles:
          - $values/environments/dev/values.yaml

    # Values
    - repoURL: https://github.com/yureshgurung/shopstack-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://10.10.10.8:6443 
    namespace: shopstack-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true